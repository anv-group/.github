      }
      .cls-1 {
        fill: #ed1c24;
        stroke-width: 0px;
      }
      .cls-2 {
        fill: #ffffff;
        stroke-width: 0px;
      }
      .cls-border {
        fill: none;
        stroke: #231f20;
        stroke-width: 1px;
      }

      /* Staggered Entrance Animations - Run once and hold */
      .anim-logo {
        animation: fadeIn 0.9s ease-out 0.2s both;
      }

      .anim-title {
        animation: slideInTitle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }

      .anim-tagline {
        animation: fadeIn 0.9s ease-out 1.1s both;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes slideInTitle {
        0% {
          opacity: 0;
          transform: translateX(-35px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-logo, .anim-title, .anim-tagline {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
        }
      }
    </style>
